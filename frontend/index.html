    <!-- ═══ Google Analytics 4 ══════════════════════════════════════════════ -->
    <!-- Measurement ID is injected at build time via VITE_GA4_MEASUREMENT_ID -->
    <!-- Replace G-XXXXXXXXXX with your real Measurement ID from GA4 console  -->
    <script>
      (function() {
        var GA_ID = 'G-XXXXXXXXXX'; // ← REPLACE with real Measurement ID
        if (!GA_ID || GA_ID === 'G-XXXXXXXXXX') {
          console.info('[GA4] Measurement ID not configured. Analytics disabled.');
          window.__GA_DISABLED__ = true;
          return;
        }
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID, {
          send_page_view: false, // Manual page views via analytics.ts trackPageView()
          cookie_flags: 'SameSite=None;Secure'
        });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
      })();
    </script>
    <!-- ════════════════════════════════════════════════════════════════════ -->
