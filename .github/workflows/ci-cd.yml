name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  deployments: write

jobs:
  contracts:
    name: Build & Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build Contracts
        run: cargo build --target wasm32-unknown-unknown
        working-directory: contracts

      - name: Run Contract Tests
        run: cargo test
        working-directory: contracts

  frontend:
    name: Build, Test & Deploy Vite Frontend
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm run test
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      # Start GitHub Deployment
      - name: Start GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: "Production deploy from main branch"

      # Deploy to Netlify
      - name: Deploy to Netlify
        id: deploy-netlify
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "::warning::Netlify credentials (NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID) are not configured. Skipping deployment."
            echo "deploy_url=https://ticketchain1.netlify.app" >> $GITHUB_OUTPUT
            exit 0
          fi
          npm install netlify-cli
          DEPLOY_OUTPUT=$(npx netlify deploy --dir=frontend/dist --prod --auth="${{ secrets.NETLIFY_AUTH_TOKEN }}" --site="${{ secrets.NETLIFY_SITE_ID }}")
          echo "$DEPLOY_OUTPUT"
          URL=$(echo "$DEPLOY_OUTPUT" | grep -oE "https://[a-zA-Z0-9-]+\.netlify\.app" | head -n 1)
          if [ -z "$URL" ]; then
            URL="https://ticketchain1.netlify.app"
          fi
          echo "deploy_url=$URL" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Update GitHub Deployment Status (Success)
      - name: Update GitHub Deployment Status (Success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: 'success'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          environment-url: ${{ steps.deploy-netlify.outputs.deploy_url }}

      # Update GitHub Deployment Status (Failure)
      - name: Update GitHub Deployment Status (Failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: 'failure'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
